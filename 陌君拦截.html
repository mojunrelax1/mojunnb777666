<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陌君拦截</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* 变量：默认黑金模式 */
  :root {
    --bg-color: #050505;
    --text-color: #ffffff;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2), inset 0 -1px 1px rgba(0,0,0,0.3);
    --label-color: rgba(255,255,255,0.4);
    --nav-inactive: rgba(255,255,255,0.5);
    --theme-color: #d4af37;
  }

  /* 变量：白天纯白模式 */
  body.light-mode {
    --bg-color: #f5f5f7;
    --text-color: #1d1d1f;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-shadow: 0 20px 50px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,1);
    --label-color: rgba(0,0,0,0.5);
    --nav-inactive: rgba(0,0,0,0.4);
  }

  body {
    background-color: var(--bg-color);
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: var(--text-color);
    height: 100vh;
    height: 100dvh;
    transition: background-color 0.5s ease, color 0.5s ease;
  }

  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 0.8s ease; }

  .page {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; 
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    transform: scale(0.96);
  }
  .page.active { opacity: 1; pointer-events: auto; transform: scale(1); }

  /* 液态玻璃 */
  .liquid-glass {
    background: var(--glass-bg);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 24px; position: relative; overflow: hidden;
    transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
  }

  /* 首页介绍卡片 */
  #intro-card {
    width: 85%; max-width: 380px; padding: 35px 30px; text-align: center;
    margin-top: 20px; transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    opacity: 0; transform: translateY(30px);
  }
  #intro-card.show { opacity: 1; transform: translateY(0); }
  
  .intro-item { margin-bottom: 18px; font-size: 15px; letter-spacing: 1px; }
  .intro-item:last-child { margin-bottom: 0; }
  .intro-label { color: var(--label-color); font-size: 13px; display: block; margin-bottom: 4px; }
  .intro-val { color: var(--theme-color); font-weight: bold; font-size: 16px; }
  
  /* 个人主页 */
  .profile-card { width: 85%; max-width: 380px; padding: 40px 30px; text-align: center; }

  .avatar {
    width: 90px; height: 90px; margin: 0 auto 20px; border-radius: 50%;
    background: rgba(150, 150, 150, 0.1); border: 1px solid var(--theme-color);
    display: flex; justify-content: center; align-items: center;
    font-size: 36px; color: var(--theme-color); box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
  }
  .profile-card h2 { font-size: 22px; margin-bottom: 8px; letter-spacing: 2px; color: var(--text-color); font-weight: 500; cursor: pointer;}
  .profile-card p { font-size: 13px; color: var(--label-color); margin-bottom: 30px; letter-spacing: 1px; cursor: pointer;}
  
  .channel-tag {
    display: inline-block; font-size: 13px; font-weight: bold; color: var(--theme-color);
    padding: 8px 20px; border-radius: 20px; background: rgba(150, 150, 150, 0.1);
    border: 1px solid var(--theme-color); letter-spacing: 1px;
  }
  .edit-tip { font-size: 11px; color: var(--label-color); margin-top: 20px; }

  /* 底部导航 */
  .nav-bar {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; padding: 6px; z-index: 20;
    opacity: 0; transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); border-radius: 40px;
    transform: translateX(-50%) translateY(20px);
  }
  .nav-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  
  .nav-pill {
    position: absolute; top: 6px; left: 6px; height: calc(100% - 12px); width: calc(50% - 6px); border-radius: 30px;
    background: var(--theme-color); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.5s;
    z-index: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  .nav-btn {
    position: relative; z-index: 2; padding: 12px 32px; border-radius: 30px; 
    font-size: 14px; font-weight: 600; color: var(--nav-inactive);
    cursor: pointer; transition: color 0.4s ease; user-select: none;
  }
  .nav-btn.active { color: #050505; }

  /* 右上角设置 */
  .settings-box {
    position: absolute; top: 20px; right: 20px; z-index: 30;
    display: flex; flex-direction: column; align-items: flex-end; gap: 15px;
    opacity: 0; transform: translateY(-20px); pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .settings-box.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  /* 改成“设”字 */
  .gear-btn {
    width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
    cursor: pointer; font-size: 16px; font-weight: bold; letter-spacing: 1px;
    color: var(--text-color); padding-left: 2px; /* 视觉居中微调 */
  }
  
  .color-panel {
    display: none; gap: 12px; padding: 12px 16px; border-radius: 20px;
    flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: 170px;
  }
  .color-panel.show { display: flex; }

  .color-btn {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.2s;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .color-btn:hover { transform: scale(1.15); }
  
  .c-gold { background: #d4af37; }
  .c-blue { background: #00d2ff; }
  .c-red { background: #ff4d4d; }
  .c-purple { background: #b06ab3; }
  .c-rainbow { background: conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); }
  
  /* 昼夜切换按钮 (黑白文字) */
  .c-theme { 
    background: transparent; border: 1px solid var(--text-color);
    display: flex; justify-content: center; align-items: center; 
    font-size: 13px; font-weight: bold; color: var(--text-color);
    box-shadow: none;
  }

  /* 闪光遮罩 */
  #flash {
    position: fixed; inset: 0; background: #fff; z-index: 100;
    opacity: 0; pointer-events: none;
  }

  /* 自定义输入弹窗 */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-box {
    width: 80%; max-width: 320px;
    background: var(--bg-color);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 25px 20px;
    text-align: center;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.5s;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-overlay.show .modal-box { transform: scale(1) translateY(0); }

  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color); }
  
  .modal-input {
    width: 100%; background: rgba(150,150,150,0.1);
    border: 1px solid var(--glass-border);
    color: var(--theme-color); font-size: 16px;
    padding: 12px; border-radius: 10px; outline: none; margin-bottom: 20px; text-align: center;
    transition: border-color 0.3s;
  }
  .modal-input:focus { border-color: var(--theme-color); }

  .modal-btns { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.2s;
  }
  .btn-cancel { background: rgba(150,150,150,0.2); color: var(--text-color); }
  .btn-confirm { background: var(--theme-color); color: #000; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="flash"></div>

<!-- 首页 -->
<div class="page active" id="page-home">
  <div class="intro-card liquid-glass" id="intro-card">
    <div class="intro-item">
      <span class="intro-label">作者</span>
      <span class="intro-val">陌君</span>
    </div>
    <div class="intro-item">
      <span class="intro-label">核心功能</span>
      <span class="intro-val" style="font-size: 14px; line-height: 1.8;">完美拦截上报下发<br>为您保驾护航</span>
    </div>
    <div class="intro-item" style="margin-top: 25px;">
      <span class="intro-label" style="margin-bottom:8px;">官方频道</span>
      <span class="intro-val">@MOJNBYYDS666</span>
    </div>
  </div>
</div>

<!-- 个人主页 -->
<div class="page" id="page-profile">
  <div class="profile-card liquid-glass">
    <div class="avatar" id="user-avatar">👤</div>
    <h2 id="display-name">陌君拦截</h2>
    <p id="display-desc">陌君拦截 · 极致稳定</p>
    <div class="channel-tag" id="profile-tag">@MOJNBYYDS666</div>
    <div class="edit-tip">点击上方文字可自定义修改</div>
  </div>
</div>

<!-- 底部导航 -->
<div class="nav-bar liquid-glass" id="nav-bar">
  <div class="nav-pill" id="nav-pill"></div>
  <div class="nav-btn active" onclick="switchPage('home', 0)">首页</div>
  <div class="nav-btn" onclick="switchPage('profile', 1)">个人主页</div>
</div>

<!-- 右上角设置 -->
<div class="settings-box" id="settings-box">
  <!-- 改成“设”字按钮 -->
  <div class="gear-btn liquid-glass" onclick="togglePanel()">设</div>
  
  <div class="color-panel liquid-glass" id="color-panel">
    <div class="color-btn c-gold" onclick="stopRainbow(); changeColor('#d4af37')"></div>
    <div class="color-btn c-blue" onclick="stopRainbow(); changeColor('#00d2ff')"></div>
    <div class="color-btn c-red" onclick="stopRainbow(); changeColor('#ff4d4d')"></div>
    <div class="color-btn c-purple" onclick="stopRainbow(); changeColor('#b06ab3')"></div>
    <div class="color-btn c-rainbow" onclick="startRainbow()" title="渐变炫彩"></div>
    <!-- 黑白切换按钮 -->
    <div class="color-btn c-theme" onclick="toggleTheme()" id="theme-btn">白</div>
  </div>
</div>

<!-- 自定义输入弹窗 -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">修改信息</div>
    <input type="text" class="modal-input" id="modal-input" placeholder="请输入内容">
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeEditModal()">取消</button>
      <button class="modal-btn btn-confirm" onclick="confirmEdit()">确定</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  let currentColor = '#d4af37'; 
  let rainbowInterval = null;

  // ==============================
  // 页面切换与变色逻辑
  // ==============================
  let currentPage = 'home';
  window.switchPage = function(pageName, index) {
    if(currentPage === pageName) return;
    const pill = document.getElementById('nav-pill');
    pill.style.transform = `translateX(${index * 100}%)`;

    const btns = document.querySelectorAll('.nav-btn');
    btns.forEach(b => b.classList.remove('active'));
    btns[index].classList.add('active');

    document.getElementById('page-home').classList.remove('active');
    document.getElementById('page-profile').classList.remove('active');
    document.getElementById('page-' + pageName).classList.add('active');

    currentPage = pageName;
  }

  window.togglePanel = function() {
    document.getElementById('color-panel').classList.toggle('show');
  }

  window.changeColor = function(color) {
    currentColor = color;
    document.documentElement.style.setProperty('--theme-color', color);
  }

  window.startRainbow = function() {
    if(rainbowInterval) clearInterval(rainbowInterval);
    let hue = 0;
    rainbowInterval = setInterval(() => {
      hue = (hue + 20) % 360; 
      const color = `hsl(${hue}, 100%, 60%)`;
      currentColor = color;
      document.documentElement.style.setProperty('--theme-color', color);
    }, 500); 
  }

  window.stopRainbow = function() {
    if(rainbowInterval) clearInterval(rainbowInterval);
  }

  // 黑白模式切换逻辑
  window.toggleTheme = function() {
    document.body.classList.toggle('light-mode');
    const themeBtn = document.getElementById('theme-btn');
    // 如果当前是白底，按钮文字变成“黑”；如果是黑底，按钮文字变成“白”
    if(document.body.classList.contains('light-mode')) {
      themeBtn.innerText = '黑';
    } else {
      themeBtn.innerText = '白';
    }
  }

  // ==============================
  // 修改信息弹窗
  // ==============================
  const editModal = document.getElementById('edit-modal');
  const modalTitle = document.getElementById('modal-title');
  const modalInput = document.getElementById('modal-input');
  
  const displayName = document.getElementById('display-name');
  const displayDesc = document.getElementById('display-desc');
  
  let editingTarget = null; 

  displayName.addEventListener('click', () => {
    editingTarget = displayName;
    modalTitle.innerText = '修改昵称';
    modalInput.value = displayName.innerText;
    editModal.classList.add('show');
    setTimeout(() => modalInput.focus(), 300);
  });

  displayDesc.addEventListener('click', () => {
    editingTarget = displayDesc;
    modalTitle.innerText = '修改个性签名';
    modalInput.value = displayDesc.innerText;
    editModal.classList.add('show');
    setTimeout(() => modalInput.focus(), 300);
  });

  window.confirmEdit = function() {
    const val = modalInput.value.trim();
    if (val && editingTarget) {
      editingTarget.innerText = val;
    }
    closeEditModal();
  }

  window.closeEditModal = function() {
    editModal.classList.remove('show');
    editingTarget = null;
  }

  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) {
      closeEditModal();
    }
  });

  // ==============================
  // 粒子动画系统
  // ==============================
  class Particle {
    constructor(x, y, targetX, targetY) {
      this.startX = Math.random() * W;
      this.startY = Math.random() * H;
      this.x = this.startX;
      this.y = this.startY;
      this.targetX = targetX;
      this.targetY = targetY;
      this.size = Math.random() * 1.5 + 0.5;
      this.progress = 0;
      this.speed = 0.005 + Math.random() * 0.003;
      this.state = 0; 
      this.vx = 0;
      this.vy = 0;
    }

    update() {
      if (this.state === 0) {
        this.progress += this.speed;
        if (this.progress > 1) this.progress = 1;
        let ease = 1 - Math.pow(1 - this.progress, 3);
        this.x = this.startX + (this.targetX - this.startX) * ease;
        this.y = this.startY + (this.targetY - this.startY) * ease;
      } else if (this.state === 1) {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
      }
    }

    draw() {
      ctx.fillStyle = currentColor;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let particles = [];
  
  function initParticles() {
    particles = [];
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');
    offCanvas.width = W;
    offCanvas.height = H;

    let fontSize = W < 600 ? 60 : 140;
    offCtx.font = `bold ${fontSize}px "Times New Roman", "Songti SC", serif`;
    offCtx.fillStyle = 'white';
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillText('陌君拦截', W / 2, H / 2 - 50);

    const imgData = offCtx.getImageData(0, 0, W, H).data;
    const step = 4; 

    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const index = (y * W + x) * 4;
        const alpha = imgData[index + 3];
        if (alpha > 128) {
          particles.push(new Particle(x, y, x, y));
        }
      }
    }
  }

  let isAnimating = true;

  function animate() {
    if (!isAnimating) return;
    ctx.clearRect(0, 0, W, H); 

    let allArrived = true;
    particles.forEach(p => {
      p.update();
      p.draw();
      if (p.state === 0 && p.progress < 1) allArrived = false;
    });

    if (allArrived && particles.length > 0) {
      isAnimating = false; 
      setTimeout(() => {
        triggerExplosion();
      }, 600);
    }
    requestAnimationFrame(animate);
  }

  function triggerExplosion() {
    particles.forEach(p => {
      p.state = 1;
      let angle = Math.random() * Math.PI * 2;
      let speed = Math.random() * 15 + 5;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
    });

    const flash = document.getElementById('flash');
    flash.style.transition = 'none';
    flash.style.opacity = '0.6'; 
    setTimeout(() => {
      flash.style.transition = 'opacity 0.4s ease';
      flash.style.opacity = '0';
    }, 50);

    isAnimating = true;
    animateExplosion();

    // 瞬间弹出 UI
    document.getElementById('intro-card').classList.add('show');
    document.getElementById('nav-bar').classList.add('show');
    document.getElementById('settings-box').classList.add('show');

    setTimeout(() => {
      canvas.style.opacity = '0';
      isAnimating = false;
    }, 1500);
  }

  function animateExplosion() {
    if (!isAnimating) return;
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animateExplosion);
  }

  initParticles();
  animate();

</script>
</body>
</html>
